<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact us</title>
  <meta name="description"
    content="Contact Snazzy Paws Grooming for enquiries, and information about our grooming services.">
  <link rel="stylesheet" href="css/my-css.css">
</head>

<body>
  <!--header-->
  <header>
    <nav class="nav" aria-label="top navigation">
      <div class="container">
        <!--company name-->
        <a href="index.html" class="logo">Snazzy Paws Grooming</a>
        <!--navigation menu-->
        <ul class="nav-menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="booking.html">Book</a></li>
          <li>
            <a href="contact.html" class="active" aria-current="page">Contact</a>
          </li>
        </ul>
      </div>
    </nav>
  </header>

  <!--main content-->
  <main>
    <section class="top-section">
      <div class="container">
        <h1>Get in touch</h1>
        <p class="section-description">We would love to hear from you.</p>
        <div class="row">
          <!--contact form-->
          <div class="column">
            <form class="booking-form" action="#">
              <h2>Contact Us</h2>
              <label for="name">Name:</label>
              <input type="text" id="name" name="name" required>

              <label for="email">Email Address:</label>
              <input type="email" id="email" name="email" required>

              <label for="phone">Phone number:</label>
              <input type="tel" id="phone" name="phone">

              <label for="comment">Your message: </label>
              <textarea id="comment" name="comment" rows="5"></textarea>

              <!--submit button-->
              <div class="submit">
                <input type="submit" class="submit-button" value="SUBMIT" aria-label="Submit the contact form">
              </div>
            </form>
          </div>
          <!--google map-->
          <div class="column">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d100912.72106074821!2d175.1659904442167!3d-37.77779231085154!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6d6d227487a63621%3A0x500ef6143a29903!2sHamilton!5e0!3m2!1sen!2snz!4v1784681270382!5m2!1sen!2snz"
              width="600" height="450" style="border: 0" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"
              aria-label="Map showing the location of Snazzy Paws Grooming in Hamilton, New Zealand"></iframe>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!--footer-->
  <footer>
    <div class="container">
      <div>
        <h2>Opening Hours</h2>
        <p>Monday - Saturday: 9am - 5pm</p>
        <p>Sunday: Closed</p>
      </div>
      <div>
        <h2>Contact Us</h2>
        <p>Phone: 07 111 1234</p>
        <p>Hamilton CBD</p>
      </div>
      <p>&copy; 2026 Snazzy Paws Grooming</p>
    </div>
  </footer>
</body>

</html>
